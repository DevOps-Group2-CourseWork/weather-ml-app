name: CI Pipeline
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        test: [unit, smoke, integration]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/${{ matrix.test }}_test.py

  docker-build-test:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6

    - name: Build Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        load: true
        tags: ${{secrets.DOCKERHUB_USERNAME}}/weather-ml-app:v3

    - name: Test Docker Image
      run: |
        docker run --rm -d --name weather-test -p 5000:5000 ${{secrets.DOCKERHUB_USERNAME}}/weather-ml-app:v3
        sleep 10
        curl -f http://localhost:5000 || (docker logs weather-test && exit 1)
        docker stop weather-test

  docker-push:
    needs: docker-build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6

    - name: Docker Login
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{secrets.DOCKERHUB_USERNAME}}/weather-ml-app:v3
          ${{secrets.DOCKERHUB_USERNAME}}/weather-ml-app:latest
