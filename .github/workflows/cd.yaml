name: CD Pipeline
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    # Only deploy after CI passes on a push to main (i.e. a merged PR).
    # CI also runs on pull_request; those runs must never deploy.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl annotate deployment/weather-ml-app kubernetes.io/change-cause="${{ github.event.workflow_run.head_sha }} - run ${{ github.run_id }}" --overwrite
          kubectl rollout status deployment/weather-ml-app --timeout=180s
