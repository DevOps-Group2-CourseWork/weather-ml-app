- name: A playbook to install kubectl and Minikube and start the cluster
  hosts: localhost
  user: ubuntu
  become: yes

  vars:
    myPath: /home/ubuntu/

  tasks:
  - name: 1. Update APT Package Manager
    apt:
      update_cache: yes

  - name: 2. Install dependency packages
    apt:
      name={{ item }}
    with_items:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg

  - name: 3. Create the keyrings directory
    shell:
      cmd: mkdir -p -m 755 /etc/apt/keyrings

  - name: 4. Get the Kubernetes APT key
    shell:
      cmd: curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key | sudo gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

  - name: 5. Add the Kubernetes APT repository
    shell:
      cmd: echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list

  - name: 6. Update Package Manager
    apt:
      update_cache: yes

  - name: 7. Install kubectl
    shell:
      cmd: snap install kubectl --classic

  - name: 8. Download Minikube
    shell:
      cmd: curl -Lo minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64

  - name: 9. Make Minikube executable
    shell:
      cmd: chmod +x minikube

  - name: 10. Move Minikube into place
    shell:
      cmd: mv minikube /usr/local/bin/

  - name: 11. Start Minikube
    become: no
    shell:
      cmd: minikube start
